recipe: default.v1
language: es

pipeline:
  # Tokenización
  - name: WhitespaceTokenizer

  # Extracción de características
  - name: RegexFeaturizer

  # Características léxico-sintácticas
  - name: LexicalSyntacticFeaturizer

  # Características de vectores de conteo para palabras
  - name: CountVectorsFeaturizer
    analyzer: word
    min_ngram: 1
    max_ngram: 2

  # Características de vectores de conteo para caracteres
  - name: CountVectorsFeaturizer
    analyzer: char_wb
    min_ngram: 1
    max_ngram: 4

  # Clasificador DIET para intents y entities
  - name: DIETClassifier
    epochs: 100
    constrain_similarities: true

  # Mapeo de sinónimos de entidades
  - name: EntitySynonymMapper

  # Selector de respuestas
  - name: ResponseSelector
    epochs: 100
    constrain_similarities: true

  # Clasificador de fallback
  - name: FallbackClassifier
    threshold: 0.3
    ambiguity_threshold: 0.1

policies:
  # Política de memorización para reglas exactas
  - name: MemoizationPolicy
    max_history: 5

  # Política de reglas para comportamiento específico
  - name: RulePolicy
    core_fallback_threshold: 0.3
    core_fallback_action_name: action_fallback
    enable_fallback_prediction: true

  # Política UnexpecTED para manejo de intents inesperados
  - name: UnexpecTEDIntentPolicy
    max_history: 5
    epochs: 100

  # Política TED para conversaciones complejas
  - name: TEDPolicy
    max_history: 5
    epochs: 100
assistant_id: 20250704-172433-creamy-captain
