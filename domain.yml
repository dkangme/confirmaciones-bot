      text:
        preview_url: false
        body: "Ok, entiendo. Gracias por avisar ☺️ Voy a cancelar esta hora entonces\nRecuerde que si así lo necesita puede reagendar su hora ingresando al siguiente link\nhttps://agenda.redsalud.cl/#/patientPortal/identifyPatientAppointments o llamando al 600 718 6000.\nGracias!"

  utter_confirm_affirm_area_dental:
  - custom:
      messaging_product: whatsapp
      recipient_type: "individual"
      type: text
      text:
        preview_url: false
        body: "area dental"

