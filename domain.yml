        preview_url: false
        body: "Oh qué pena 😞, cancelaré la hora y le avisaré al doctor que no viene el {fecha_hora_formato}.\nRecuerde que si así lo necesita puede reagendar su hora ingresando al siguiente link\nhttps://agenda.redsalud.cl/#/patientPortal/identifyPatientAppointments o llamando al 600 718 6000.\nGracias!"

