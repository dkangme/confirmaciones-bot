responses:
  utter_greet:
  - condition:
    - type: slot
      name: campaign_name
      value: "confirmacion"
    custom:
      messaging_product: whatsapp
      recipient_type: "individual"
      type: template
      template:
        name: "{campaign_name}"
        language:
          code: ES_AR
        components:
        - type: body
          parameters:
          - type: text
            text: "{nombre_paciente}"
          - type: text
            text: "{bot_name}"
          - type: text
            text: "{area_medica}"
          - type: text
            text: "{fecha_hora_formato}"
          - type: text
            text: "{resource_name}"
          - type: text
            text: "{especialidad}"
          - type: text
            text: "{centro_medico}"
  - condition:
    - type: slot
      name: campaign_name
      value: "reconfirmacion"
    custom:
      messaging_product: whatsapp
      recipient_type: "individual"
      type: interactive
      interactive:
        type: button
        header:
          text: "Confirmación de cita"
          type: "TEXT"
        body:
          text: "Hola {nombre_paciente}, 👋 por favor recuerde mi pregunta. {resource_name} me pidió que confirmara su hora para el {fecha_hora_formato} en {centro_medico}. ¿Confirma su hora?"
        footer:
          text: "Seleccione una opción"
        action:
          buttons:
          - type: reply
            reply:
              id: "affirm"
              title: "Si"
          - type: reply
            reply:
              id: "deny"
              title: "No"
  - text: "Hey! How are you?"

  utter_rebooking_cancelled:
  - custom:
      messaging_product: whatsapp
      recipient_type: "individual"
      type: text
      text:
        preview_url: false
        body: "Ok, no hay problema, agradecemos su tiempo, Recuerde que *puede agendar una nueva cita a través de nuestra página Web* https://agenda.redsalud.cl/#/patientPortal/identifyPatientAppointments o llamando al 600 718 6000. Que tenga un excelente día.\n\n¡Gracias! 😊"

  utter_rebooking:
  - custom:
      messaging_product: whatsapp
      recipient_type: "individual"
      type: interactive
      interactive:
        type: button
        body: 
          text: "¿Le gustaría que busquemos una nueva fecha que le acomode mejor?"
        action:
          buttons:
            - type: reply
              reply:
                id: affirm
                title: "Sí"
            - type: reply
              reply:
                id: deny
                title: "No"

  utter_rebooking_confirmed:
  - custom:
      messaging_product: whatsapp
      recipient_type: "individual"
      type: text
      text:
        preview_url: false
        body: "Perfecto {nombre_paciente}, vamos a buscar una nueva fecha que le acomode mejor.\n\n🔄 **Reagendamiento Confirmado**\n\n📅 Fecha actual: {fecha_hora_formato}\n👨‍⚕️ Doctor: {resource_name}\n🏥 Centro: {centro_medico}\n\n⏳ **Procesando su solicitud...**\n\nNuestro equipo se pondrá en contacto con usted pronto para ofrecerle nuevas opciones de horarios disponibles.\n\nGracias por su paciencia."

  utter_rebooking_ask_date:
  - custom:
      messaging_product: whatsapp
      recipient_type: "individual"
      type: text
      text:
        preview_url: false
        body: "Por favor, indícame qué fecha y hora te gustaría para tu cita."

  utter_show_available_slots:
  - custom:
      messaging_product: whatsapp
      recipient_type: "individual"
      type: text
      text:
        preview_url: false
        body: "📅 **Horarios disponibles:**\n\n{available_slots}\n\nResponde con el número de la opción que prefieras."

  utter_show_options:
  - custom:
      messaging_product: whatsapp
      recipient_type: "individual"
      type: interactive
      interactive:
        type: list
        body: 
          text: "¡Perfecto! 😊 Estas son las opciones más cercanas disponibles:"
        footer:
          text: "¿Cuál de estas fechas le acomoda más?"
        action:
          button: "Fechas disponibles"
          sections:
            - rows:
              - id: 1
                title: "Lunes 16 de julio"
                description: "10:00 horas"                
              - id: 2
                title: "Lunes 16 de julio"
                description: "10:15 horas"                
              - id: 3
                title: "Lunes 16 de julio"
                description: "10:30 horas"                
              - id: 4
                title: "Ninguna"

  utter_show_rebooking_menu:
  - custom:
      messaging_product: whatsapp
      recipient_type: "individual"
      type: interactive
      interactive:
        type: list
        header:
          type: text
          text: "Menú de Opciones"
        body:
          text: "Soy un asistente virtual, para poder ayudarle seleccione una de las siguientes opciones. 👇"
        footer:
          text: "Seleccione una opción"
        action:
          button: "Opciones"
          sections:
            - title: "Opciones disponibles"
              rows:
                - id: "reagendamiento_menu_opcion_1"
                  title: "✅"
                  description: "No, muchas gracias."
                - id: "reagendamiento_menu_opcion_2"
                  title: "❎"
                  description: "Quiero anular mi hora."
                - id: "reagendamiento_menu_opcion_3"
                  title: "🔄"
                  description: "Quiero reagendar mi hora."
                - id: "reagendamiento_menu_opcion_4"
                  title: "💲"
                  description: "Quiero saber los valores de la atención."
                - id: "reagendamiento_menu_opcion_5"
                  title: "💳"
                  description: "Quiero pagar mi cita Online."
                - id: "reagendamiento_menu_opcion_6"
                  title: "❓"
                  description: "Otras consultas."

  utter_waiting_for_confirmation:
  - custom:
      messaging_product: whatsapp
      recipient_type: "individual"
      type: text
      text:
        preview_url: false
        body: "Ok, deme un minuto para dejarla agendada en el sistema."

  utter_rebooking_success:
  - custom:
      messaging_product: whatsapp
      recipient_type: "individual"
      type: text
      text:
        preview_url: false
        body: "Perfecto, su hora quedó agendada para el {fecha_seleccionada_confirmada}.😊\n\n🕑Recuerde llegar 20 minutos antes de su hora.\n\nEn caso de no poder asistir, le agradeceríamos anular o cambiar su hora en https://agenda.redsalud.cl/#/patientPortal/identifyPatientAppointments para asi dejar disponible la hora a otro paciente.\n\nLo esperamos! 😊\n\nopcion: {opcion_seleccionada}👻"

  utter_confirm_deny:
  - custom:
      messaging_product: whatsapp
      recipient_type: "individual"
      type: text
      text:
        preview_url: false
        body: "Entendido {nombre_paciente}, su cita para el {fecha_hora_formato} ha sido cancelada.\n\n❌ **Cita Cancelada**\n\n📅 Fecha: {fecha_hora_formato}\n👨‍⚕️ Doctor: {resource_name}\n🏥 Centro: {centro_medico}\n\n🔄 **Próximos Pasos:**\n• Si desea reprogramar su cita, puede contactarnos nuevamente\n• Si tiene alguna pregunta, no dude en consultarnos\n• Recuerde que puede acceder a sus exámenes y recetas en miredsalud.cl\n\nGracias por avisarnos con anticipación. ¡Que tenga un buen día!"

  utter_cancel_appointment_failed:
  - custom:
      messaging_product: whatsapp
      recipient_type: "individual"
      type: text
      text:
        preview_url: false
        body: "Tuvimos un problema al cancelar su cita para el {fecha_hora_formato}.\n\nRecuerde que si así lo necesita puede reagendar su hora ingresando al siguiente link https://agenda.redsalud.cl/#/patientPortal/identifyPatientAppointments o llamando al 600 718 6000.\n\nGracias!\n\n"

  utter_confirmation_appointment_failed:
  - custom:
      messaging_product: whatsapp
      recipient_type: "individual"
      type: text
      text:
        preview_url: false
        body: "Tuvimos un problema en confirmar su cita para el {fecha_hora_formato}.\n\nRecuerde que si así lo necesita puede reagendar su hora ingresando al siguiente link https://agenda.redsalud.cl/#/patientPortal/identifyPatientAppointments o llamando al 600 718 6000.\n\nGracias!\n\n"

  utter_confirm_header:
  - custom:
      messaging_product: whatsapp
      recipient_type: "individual"
      type: text
      text:
        preview_url: false
        body: "Confirmado para el {fecha_hora_formato} ☺️\n🕑 Recuerde llegar 15 minutos antes de su hora.\n📍 Dirección: {centro_medico_address} ({centro_medico_google})."

  utter_confirm_footer:
  - custom:
      messaging_product: whatsapp
      recipient_type: "individual"
      type: text
      text:
        preview_url: false
        body: "¡Lo esperamos! ☺️\nSi por algún motivo no puede asistir a su cita le pido que por favor nos avise por este mismo medio, otro paciente podría necesitarla"

  utter_confirm_centro_medico:
  - custom:
      messaging_product: whatsapp
      recipient_type: "individual"
      type: text
      text:
        preview_url: false
        body: "🚨 Recuerde que desde ahora puede acceder a sus exámenes, órdenes y recetas en miredsalud.cl"

  utter_confirm_medicina_general:
