      text:
        preview_url: false
        body: "Confirmado para {fecha_hora_formato} ☺️\n🕑 Recuerde llegar 15 minutos antes de su hora.\n📍 Dirección: {centro_medico_address} ({centro_medico_google}).\n🚨 Recuerde que desde ahora puede acceder a sus exámenes, órdenes y recetas en miredsalud.cl\nCuide su salud dental siguiendo los siguientes consejos:\n-https://drive.google.com/file/d/1xvnUPDohXBcvx0WyMzAw7baN-ItBkTWP/view\n¡Lo esperamos! ☺️"

  utter_confirm_dental_footer:
