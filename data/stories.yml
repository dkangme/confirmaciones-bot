version: "3.1"

stories:

# Flujo de inicialización de contexto
- story: external init context
  steps:
  - intent: EXTERNAL_init_context
  - action: action_init_context


# Flujo completo de confirmación de cita
- story: complete confirmation flow
  steps:
  - slot_was_set:
    - contexto: "confirmación"
  - intent: greet
  - action: utter_greet
  - intent: affirm
  - action: action_confirm_appointment
  - action: action_eval_response
  - action: action_schedule_payment_button

# Flujo completo de cancelación de cita
- story: complete cancellation flow
  steps:
  - slot_was_set:
    - contexto: "confirmación"
  - intent: greet
  - action: utter_greet
  - intent: deny
  - action: action_schedule_cancellation
  - slot_was_set:
    - cancellation_pending: true
  - intent: regret_cancellation
  - action: action_process_regret_cancellation
  - slot_was_set:
    - cancellation_pending: false
    - post_regret_context: true

# Flujo de cita mantenida después del arrepentimiento (user clicks "Sí, mantener cita")
- story: appointment kept after regret
  steps:
  - slot_was_set:
    - contexto: "confirmación"
  - intent: greet
  - action: utter_greet
  - intent: deny
  - action: action_schedule_cancellation
  - slot_was_set:
    - cancellation_pending: true
  - intent: regret_cancellation
  - action: action_process_regret_cancellation
  - slot_was_set:
    - cancellation_pending: false
    - post_regret_context: true
  - intent: affirm
  - action: action_confirm_post_cancel

# Flujo de cancelación confirmada después del arrepentimiento (user clicks "No, cancelar cita")
- story: cancellation confirmed after regret
  steps:
  - slot_was_set:
    - contexto: "confirmación"
  - intent: greet
  - action: utter_greet
  - intent: deny
  - action: action_schedule_cancellation
  - slot_was_set:
    - cancellation_pending: true
  - intent: regret_cancellation
  - action: action_process_regret_cancellation
  - slot_was_set:
    - cancellation_pending: false
    - post_regret_context: true
  - intent: deny
  - action: action_cancel_appointment





