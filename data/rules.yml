version: "3.1"

rules:

# ===== INICIALIZACIÓN DE CONTEXTOS =====

- rule: Initialize context when EXTERNAL_init_context is triggered
  steps:
  - intent: EXTERNAL_init_context
  - action: action_init_context



# ===== FLUJO DE CONFIRMACIÓN DE CITA =====

- rule: Greet with confirmation template when context is confirmación
  condition:
  - slot_was_set:
    - contexto: "confirmación"
  steps:
  - intent: greet
  - action: utter_greet

- rule: Confirm appointment when user affirms in confirmación context (initial)
  condition:
  - slot_was_set:
    - contexto: "confirmación"
    - cancellation_pending: false
    - post_regret_context: false
    - menu_post_confirmation: false
  steps:
  - intent: affirm
  - action: action_confirm_appointment
  - action: action_eval_response
  - action: action_schedule_payment_button

- rule: Cancel appointment when user denies in confirmación context (initial)
  condition:
  - slot_was_set:
    - contexto: "confirmación"
    - cancellation_pending: false
    - post_regret_context: false
    - menu_post_confirmation: false
  steps:
  - intent: deny
  - action: action_schedule_cancellation

- rule: Process regret cancellation when cancellation is pending
  condition:
  - slot_was_set:
    - cancellation_pending: true
  steps:
  - intent: regret_cancellation
  - action: action_process_regret_cancellation

- rule: Keep appointment after regret (user clicks "Sí, mantener cita")
  condition:
  - slot_was_set:
    - post_regret_context: true
    - contexto: "confirmación"
  steps:
  - intent: affirm
  - action: action_confirm_post_cancel

- rule: Confirm cancellation after regret (user clicks "No, cancelar cita")
  condition:
  - slot_was_set:
    - post_regret_context: true
    - contexto: "confirmación"
  steps:
  - intent: deny
  - action: action_cancel_appointment



# ===== FLUJO DE REBOOKING =====

- rule: Initialize rebooking context when EXTERNAL_init_rebooking is triggered
  steps:
  - intent: EXTERNAL_init_rebooking
  - action: action_init_rebooking

- rule: Handle rebooking intent when contexto_rebooking is set
  condition:
  - slot_was_set:
    - contexto_rebooking: "rebooking"
  steps:
  - intent: rebooking
  - action: utter_rebooking

- rule: Handle affirm intent in rebooking context (initial)
  condition:
  - slot_was_set:
    - contexto_rebooking: "rebooking"
    - cancellation_pending: false
    - post_regret_context: false
    - menu_post_confirmation: false
  steps:
  - intent: affirm
  - action: utter_rebooking_ask_date

- rule: Handle date proposal in rebooking context
  condition:
  - slot_was_set:
    - contexto_rebooking: "rebooking"
    - menu_post_confirmation: false
  steps:
  - intent: proponer_fecha
  - action: action_process_date_request
  - action: action_show_available_slots

- rule: Handle option selection in rebooking context
  condition:
  - slot_was_set:
    - contexto_rebooking: "rebooking"
    - menu_post_confirmation: false
  steps:
  - intent: seleccionar_opcion
  - action: action_process_slot_selection

- rule: Handle new date selection in rebooking context
  condition:
  - slot_was_set:
    - contexto_rebooking: "rebooking"
    - menu_post_confirmation: false
  steps:
  - intent: seleccionar_cita_nueva_fecha
  - action: action_process_slot_selection

- rule: Handle deny intent in rebooking context
  condition:
  - slot_was_set:
    - contexto_rebooking: "rebooking"
    - cancellation_pending: false
    - post_regret_context: false
    - menu_post_confirmation: false
  steps:
  - intent: deny
  - action: utter_rebooking_cancelled
  - action: action_handle_rebooking_denial

- rule: Handle affirm intent for rebooking confirmation (after slot selection)
  condition:
  - slot_was_set:
    - contexto_rebooking: "rebooking"
    - selected_slot: true
  steps:
  - intent: affirm_rebooking_confirm
  - action: action_confirm_rebooking

# ===== FALLBACK PARA REBOOKING =====

- rule: Fallback for rebooking when bot doesn't understand (not in post confirmation context)
  condition:
  - slot_was_set:
    - contexto_rebooking: "rebooking"
    - cancellation_pending: false
    - post_regret_context: false
    - contexto_rebooking_menu: null
    - menu_post_confirmation: false
  steps:
  - intent: nlu_fallback
  - action: action_fallback

- rule: Handle out of scope text in rebooking context (not in post confirmation context)
  condition:
  - slot_was_set:
    - contexto_rebooking: "rebooking"
    - cancellation_pending: false
    - post_regret_context: false
    - contexto_rebooking_menu: null
    - menu_post_confirmation: false
  steps:
  - intent: out_of_scope
  - action: action_fallback

# ===== MANEJO DE CANCELACIÓN =====

- rule: Handle cancellation reminder
  condition:
    - slot_was_set:
        - cancellation_pending: true
  steps:
    - intent: EXTERNAL_cancellation
    - action: action_cancel_appointment

# ===== MENÚ POST-CONFIRMACIÓN =====

- rule: Handle affirm after confirmation (show post confirmation menu)
  condition:
  - slot_was_set:
    - menu_post_confirmation: true
  steps:
  - intent: affirm
  - action: utter_show_post_confirmation_menu

- rule: Show post confirmation menu for cancel_appointment
  condition:
  - slot_was_set:
    - menu_post_confirmation: true
  steps:
  - intent: cancel_appointment
  - action: utter_show_post_confirmation_menu

- rule: Show post confirmation menu for reschedule_appointment
  condition:
  - slot_was_set:
    - menu_post_confirmation: true
  steps:
  - intent: reschedule_appointment
  - action: utter_show_post_confirmation_menu

- rule: Show post confirmation menu for ask_prices
  condition:
  - slot_was_set:
    - menu_post_confirmation: true
  steps:
  - intent: ask_prices
  - action: utter_show_post_confirmation_menu

- rule: Show post confirmation menu for pay_online
  condition:
  - slot_was_set:
    - menu_post_confirmation: true
  steps:
  - intent: pay_online
  - action: utter_show_post_confirmation_menu

# ===== MENÚ POST-CONFIRMACIÓN TELEMEDICINA =====

- rule: Show telemedicine post confirmation menu for cancel_appointment
  condition:
  - slot_was_set:
    - menu_post_confirmation_tm: true
  steps:
  - intent: cancel_appointment
  - action: utter_show_post_conf_telem_menu

- rule: Show telemedicine post confirmation menu for problema_atencion
  condition:
  - slot_was_set:
    - menu_post_confirmation_tm: true
  steps:
  - intent: problema_atencion
  - action: utter_show_post_conf_telem_menu

# ===== MANEJO DE FALLBACK =====

- rule: Fallback when bot doesn't understand (not in post confirmation context)
  condition:
  - slot_was_set:
    - cancellation_pending: false
    - post_regret_context: false
    - contexto_rebooking_menu: null
    - menu_post_confirmation: false
  steps:
  - intent: nlu_fallback
  - action: action_fallback

- rule: Handle out of scope text (not in post confirmation context)
  condition:
  - slot_was_set:
    - cancellation_pending: false
    - post_regret_context: false
    - contexto_rebooking_menu: null
    - menu_post_confirmation: false
  steps:
  - intent: out_of_scope
  - action: action_fallback

# ===== FALLBACK EN CONTEXTO POST-CONFIRMACIÓN =====

- rule: Fallback in post confirmation context
  condition:
  - slot_was_set:
    - menu_post_confirmation: true
  steps:
  - intent: nlu_fallback
  - action: action_fallback

- rule: Handle out of scope text in post confirmation context
  condition:
  - slot_was_set:
    - menu_post_confirmation: true
  steps:
  - intent: out_of_scope
  - action: action_fallback


