version: "3.1"

rules:

# Regla para inicialización del menú de reagendamiento
- rule: external init rebooking menu
  steps:
  - intent: EXTERNAL_init_rebooking_menu
  - action: action_init_rebooking_menu

# Regla para mostrar menú de reagendamiento
- rule: show rebooking menu
  condition:
  - slot_was_set:
    - contexto_rebooking_menu: "activado"
  steps:
  - intent: reschedule_appointment
  - action: utter_show_rebooking_menu

# Regla para cancelar cita desde menú
- rule: cancel appointment from menu
  condition:
  - slot_was_set:
    - contexto_rebooking_menu: "activado"
  steps:
  - intent: cancel_appointment
  - action: utter_show_rebooking_menu

# Regla para consultar precios desde menú
- rule: ask prices from menu
  condition:
  - slot_was_set:
    - contexto_rebooking_menu: "activado"
  steps:
  - intent: ask_prices
  - action: utter_show_rebooking_menu

# Regla para pagar online desde menú
- rule: pay online from menu
  condition:
  - slot_was_set:
    - contexto_rebooking_menu: "activado"
  steps:
  - intent: pay_online
  - action: utter_show_rebooking_menu

# Regla para out of scope desde menú
- rule: out of scope from menu
  condition:
  - slot_was_set:
    - contexto_rebooking_menu: "activado"
    - post_regret_context: false
    - contexto_rebooking: null
  steps:
  - intent: out_of_scope
  - action: utter_show_rebooking_menu

# Reglas para opciones del menú de reagendamiento
- rule: reagendamiento menu opcion 1
  condition:
  - slot_was_set:
    - contexto_rebooking_menu: "activado"
  steps:
  - intent: reagendamiento_menu_opcion1
  - action: utter_reagendamiento_opcion1

- rule: reagendamiento menu opcion 2
  condition:
  - slot_was_set:
    - contexto_rebooking_menu: "activado"
  steps:
  - intent: reagendamiento_menu_opcion2
  - action: utter_reagendamiento_opcion2

- rule: reagendamiento menu opcion 3
  condition:
  - slot_was_set:
    - contexto_rebooking_menu: "activado"
  steps:
  - intent: reagendamiento_menu_opcion3
  - action: utter_reagendamiento_opcion3

- rule: reagendamiento menu opcion 4
  condition:
  - slot_was_set:
    - contexto_rebooking_menu: "activado"
  steps:
  - intent: reagendamiento_menu_opcion4
  - action: utter_reagendamiento_opcion4

- rule: reagendamiento menu opcion 5
  condition:
  - slot_was_set:
    - contexto_rebooking_menu: "activado"
  steps:
  - intent: reagendamiento_menu_opcion5
  - action: utter_reagendamiento_opcion5

- rule: reagendamiento menu opcion 6
  condition:
  - slot_was_set:
    - contexto_rebooking_menu: "activado"
  steps:
  - intent: reagendamiento_menu_opcion6
  - action: utter_reagendamiento_opcion6 