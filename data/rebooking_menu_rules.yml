version: "3.1"

rules:

# Regla para inicialización del menú de reagendamiento
- rule: external init rebooking menu
  steps:
  - intent: EXTERNAL_init_rebooking_menu
  - action: action_init_rebooking_menu

# Reglas para opciones del menú de reagendamiento
- rule: reagendamiento menu opcion 1
  condition:
  - slot_was_set:
    - contexto_rebooking_menu: "activado"
  steps:
  - intent: reagendamiento_menu_opcion1
  - action: utter_reagendamiento_opcion1

- rule: reagendamiento menu opcion 2
  condition:
  - slot_was_set:
    - contexto_rebooking_menu: "activado"
  steps:
